name: Build OPL MMCE + XInput

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile OPL with MMCE and PADEMU
        run: |
          make clean
          make PADEMU=1

      - name: Upload Compiled OPNPS2LD.ELF
        uses: actions/upload-artifact@v4
        with:
          name: OPNPS2LD-MMCE-XINPUT
          path: OPNPS2LD.ELF
